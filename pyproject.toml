[project]
name = "bistmas"
version = "0.1.0"
description = "Rule- and LLM-based hybrid multi-agent stock selection system for Borsa İstanbul (TÜBİTAK 2209-A research project)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
  { name = "Vedat Ali Tatlı", email = "vedattatli6@gmail.com" },
]
keywords = ["borsa-istanbul", "bist", "multi-agent", "llm", "factor-investing", "backtest"]
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=17",
  "duckdb>=1.1",
  "requests>=2.32",
  "pydantic>=2.8",
  "ollama>=0.4",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "pypdf>=5.0",
  "lxml>=5.2",
  "openpyxl>=3.1.5",
  "yfinance>=1.7.0",
  "matplotlib>=3.11.2",
  "xlrd>=2.0.2",
]

[project.scripts]
bistmas = "bistmas.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "import-linter>=2.1",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bistmas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: requires internet access; run with BISTMAS_NETWORK=1"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

# ---------------------------------------------------------------------------
# Work-area boundaries (enforced with `uv run lint-imports`).
# data           -> may only import shared
# scoring        -> may import data, shared
# backtest       -> may import scoring, data, shared (never jury/reporting)
# jury           -> may import scoring, data, shared (never backtest/reporting)
# reporting      -> may import everything
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "bistmas"

[[tool.importlinter.contracts]]
name = "data layer is independent of decision layers"
type = "forbidden"
source_modules = ["bistmas.data"]
forbidden_modules = ["bistmas.scoring", "bistmas.backtest", "bistmas.jury", "bistmas.reporting"]

[[tool.importlinter.contracts]]
name = "scoring does not depend on backtest, jury or reporting"
type = "forbidden"
source_modules = ["bistmas.scoring"]
forbidden_modules = ["bistmas.backtest", "bistmas.jury", "bistmas.reporting"]

[[tool.importlinter.contracts]]
name = "backtest never imports the jury (jury scores arrive as data files)"
type = "forbidden"
source_modules = ["bistmas.backtest"]
forbidden_modules = ["bistmas.jury", "bistmas.reporting"]

[[tool.importlinter.contracts]]
name = "jury never imports backtest or reporting"
type = "forbidden"
source_modules = ["bistmas.jury"]
forbidden_modules = ["bistmas.backtest", "bistmas.reporting"]

[[tool.importlinter.contracts]]
name = "core layers never import experiments"
type = "forbidden"
source_modules = ["bistmas.data", "bistmas.scoring", "bistmas.backtest", "bistmas.jury"]
forbidden_modules = ["bistmas.experiments"]
